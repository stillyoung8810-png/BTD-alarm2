# Supabase Lambda 레이어 zip 생성 (Linux + Python 3.11)
# Actions 탭 → "Build Supabase Layer" → Run workflow → 완료 후 Artifacts에서 zip 다운로드
name: Build Supabase Layer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Lambda는 /opt/python/lib/python3.11/site-packages 를 PYTHONPATH에 추가함
      - name: Install supabase into python/lib/python3.11/site-packages/
        run: |
          mkdir -p lambda-layers/supabase/python/lib/python3.11/site-packages
          pip install --no-compile supabase -t lambda-layers/supabase/python/lib/python3.11/site-packages

      # 250MB 제한 대비: 불필요한 파일 제거 (목표: 압축 해제 기준 100MB 이하)
      - name: Shrink layer (remove __pycache__, .pyc, .pyi, tests, .dist-info)
        run: |
          SITE=lambda-layers/supabase/python/lib/python3.11/site-packages
          find "$SITE" -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find "$SITE" -type f -name "*.pyc" -delete 2>/dev/null || true
          find "$SITE" -type f -name "*.pyi" -delete 2>/dev/null || true
          find "$SITE" -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find "$SITE" -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find "$SITE" -type d -name "testing" -exec rm -rf {} + 2>/dev/null || true
          find "$SITE" -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
          find "$SITE" -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true
          find "$SITE" -type d -name "docs" -exec rm -rf {} + 2>/dev/null || true
          echo "Layer dir size:"
          du -sh "$SITE"

      - name: Create zip (python/ at top level)
        run: |
          cd lambda-layers/supabase
          zip -r supabase-layer-linux.zip python

      - name: Verify zip structure (Lambda expects this path)
        run: |
          cd lambda-layers/supabase
          unzip -l supabase-layer-linux.zip | head -20
          test -d python/lib/python3.11/site-packages && test -d python/lib/python3.11/site-packages/supabase && echo "OK: structure correct for Lambda"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-layer-linux
          path: lambda-layers/supabase/supabase-layer-linux.zip
